  level_min: 4
  promote_success: 0.65
  demote_success: 0.25
  success_ema_alpha: 0.05
  flat_frac: 0.5
  success_margin: 0.05
  min_rel_height: 0.18
  max_rel_height: 0.62
  max_pitch: 0.6109
  max_roll: 0.4363
  back_margin: 100.0
  w_progress: 2.0
  progress_cap: 1.0
