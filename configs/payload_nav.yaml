# RUN 3 (payload_nav3). Run 2 (sigma 0.1) at 7M: turn right -0.53/-0.6, turn left
# +0.54/+0.6 (learned natively by 7M), sidestep right emerging (-0.10/-0.2) -- but backing up
# still 0.00, and it is the one skill the table-B route cannot do without (turning in place
# at the rack drifts the base 14 cm into the bench). Warm start = run 2 @ 7M; back-up raised
# to 35% of commands, turns cut to 10%.
# RUN 2 (payload_nav2), 2026-09-19. Run 1 (tracking_sigma 0.25, warm start = the 33M
# payload checkpoint) was stopped at 5.2M: CPU tracking at 1.7M and 5.2M was unchanged --
# turn in place, back up, sidestep and 0.15 m/s all still STOOD STILL, while reward rose only
# through longer episodes. Not exploration (action std ~0.5, highest on turn commands). The
# reward: stepping costs ~0.3-0.4/step in penalties (eval logs), while ignoring a command
# cost only 0.26/step at 0.15 m/s and 0.66 backing at 0.25 m/s under sigma 0.25 -- standing
# WAS the optimum. sigma 0.1 makes ignoring a command cost 0.60 / 1.40 / 1.46 (slow / back /
# turn). Warm start = run 1's 5.2M checkpoint (already on the new command ranges).
# NAVIGATION fine-tune: turn in place, back up, sidestep. Warm start = the 33M payload
# checkpoint (the one the Phase 1 gate was run on).
#
# WHY (measured 2026-09-19, CPU controller and MJX agree to ~5%): that policy walks forward
# at >= 0.2 m/s and makes gentle LEFT arcs, and nothing else. Pure yaw (0,0,0.5): 0.7 deg in
# 3 s. Sidestep: 0 m. vx < 0.2: stands. (0.2, 0, -0.6): stands. The two-table transfer starts
# with the robot's nose 10 cm from the bench and must turn around on a 3 m walkway, which
# that policy cannot do; the transfer clip used a kinematic slide instead, and that is what
# this run exists to replace. Changes, each tied to a cause in the reward:
#   * cmd_p_turn/back/lateral: 45% of commands are the modes it never saw;
#   * cmd_vx lower bound -0.3 in the general mode; wz range +-1.0;
#   * turn_is_moving: the air-time (gait) reward now pays during turns, which is why it
#     shuffled/stood instead of stepping;
#   * w_ang_vel 0.8 -> 1.5: yaw error was too cheap next to w_lin_vel 3.0;
#   * flat_frac 0.2 -> 0.5: navigation is mostly on the flat walkway; the step stays in.
