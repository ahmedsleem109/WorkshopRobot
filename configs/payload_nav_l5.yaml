  num_timesteps: 6000000
  num_envs: 4096
  episode_length: 1000
  unroll_length: 20
  batch_size: 256
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 0.0002
  max_grad_norm: 1.0
  entropy_cost: 0.01
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  reward_scaling: 0.1
  normalize_observations: true
  num_evals: 10
  num_eval_envs: 128
  log_training_metrics: true
  seed: 0
