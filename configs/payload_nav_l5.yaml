# NAV + L5 STEP (payload_nav_l5), session 7. The run that can actually be DEPLOYED against the
# project's last blocker.
#
# WHY A SEPARATE RUN FROM payload_l5b: the two lineages are siblings off the 33M payload
# checkpoint and they are not interchangeable. `payload_l5` trains the STEP (level_init 5 =
# 0.130 m) on the ORIGINAL command distribution -- forward walking only -- so it can serve the
# Phase 1 gate and the height sweep, which need no turning. But the deployed policy is
# `payload_nav_policy.npz` (= payload_nav3 final): the pipeline cannot work without turn in place,
# back up and sidestep, and nav3 trained at level_init 4 (0.110 m) / level_min 3. The 12 cm step
# DOWN off the walkway -- 8 of the 10 end-to-end failures -- is therefore taken by a policy whose
# curriculum never contained it. Swapping payload_l5b in would lose navigation; this run puts the
# step INSIDE the nav lineage's own distribution instead.
#
# ONE change from payload_nav3: level_init 4 -> 5, level_min 3 -> 4. Warm start = nav3 final.
# Everything else -- the command probabilities, tracking_sigma 0.1, turn_is_moving -- is nav3's,
# so the comparison against nav3 at a fixed step count is a comparison of the curriculum alone.
run_name: payload_nav_l5
env_class: stairs
rest_every_s: 900
rest_seconds: 120
scene: unused-generated-by-env
init_params: /home/sleem/bringwrench/runs/results/2026-09-19_16-27-13-payload_nav3/checkpoints/final
network:
  policy:
  - 512
  - 256
  - 128
  value:
  - 512
  - 256
  - 128
