# Targeted continuation of the 60M payload run, NOT a fresh fine-tune.
#
# WHY: gate 2 tests a 0.12 m rise / 0.30 m tread. The 60M run trained EXCLUSIVELY at
# curriculum level 4 (0.110 m / 0.32 m) because promotion needs a success EMA > 0.65
# (promote_success) and the run plateaued at 0.37-0.40 -- so it could never reach L5 and
# never saw the step height the gate demands. Both genuine gate-2 falls were the TRUNK
# striking the riser 8-11 cm before a step 1 cm taller than anything it trained on.
#
# level_init 5 (0.130 m) puts the gate geometry INSIDE the training distribution;
# level_min 4 keeps 0.110 m in the mix so the easier step is not forgotten.
# Warm start is the 60M run best checkpoint (step 33,013,760: reward 3196, succ 0.40).
